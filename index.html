<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="main.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dz-1">
        <p><b>Магазин</b></p>
        <div>
            <div class="mt-3">
                <label for="name">Название</label>
                <input type="text" id="name">
            </div>
            <div class="mt-3">
                <label for="price">Цена</label>
                <input type="number" id="price">
            </div>
            <button class="mt-3" id="buyBtn" onclick="buyGood()">Купить</button>
            <p class="err-msg d-none">Заполнены не все поля</p>
        </div>
        <div class="mt-3">
            <div class="basket"></div>
        </div>
        <div id="catalog" class="mt-3"></div>
    </div>


    <div class="dz-2">
        <div class="modal">
            <div class="modal__bgc"></div>
            <div class="modal__container">
                <div class="">

                </div>
                <div class="btns">
                    <button class="arrow-left">left</button>
                    <button class="arrow-right">right</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
